name: Local Verify

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact lowercase commit SHA to verify
        required: true
        type: string

permissions:
  contents: read

jobs:
  local-verify:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTEST_ADDOPTS: ""
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      PYTEST_PLUGINS: ""
      PYTHONPATH: ""

    steps:
      - name: Validate expected SHA
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          if ($env:EXPECTED_SHA -cnotmatch '^[0-9a-f]{40}$') {
            throw 'expected_sha must be a lowercase 40-character commit SHA'
          }

      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.expected_sha }}
          persist-credentials: false

      - name: Assert checked out SHA
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          $actualSha = git rev-parse HEAD
          if ($actualSha -cne $env:EXPECTED_SHA) {
            throw 'checked out commit does not match expected_sha'
          }

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          # Python 3.12.10 is the final 3.12 release with Windows binaries.
          python-version: "3.12.10"
          check-latest: false

      - name: Show Python version
        run: python --version

      - name: Install development requirements
        run: python -m pip install --require-hashes --only-binary=:all: -r requirements-dev.lock

      - name: Check development dependencies
        run: python -m pip check

      - name: Run tests
        run: python -m pytest tests --durations=50 -rs

      - name: Run standalone evals
        run: python scripts/run_eval.py

      - name: Run quality gate
        run: python scripts/quality_gate.py

      - name: Render python_cli example dry-run
        run: python scripts/render_template.py --config examples/python_cli_minimal/template.config.yml --target examples/python_cli_minimal --dry-run

      - name: Render csharp_desktop example dry-run
        run: python scripts/render_template.py --config examples/csharp_desktop_minimal/template.config.yml --target examples/csharp_desktop_minimal --dry-run

      - name: Render plc_tool example dry-run
        run: python scripts/render_template.py --config examples/plc_tool_minimal/template.config.yml --target examples/plc_tool_minimal --dry-run
