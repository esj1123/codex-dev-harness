[pytest]
testpaths = tests
norecursedirs =
    .git
    .pytest_cache
    __pycache__
    local
markers =
    optional_agent_quality: Agent Quality tests for the FROZEN/NOT_ADOPTED capability.
    optional_hermes_mcp: Hermes/MCP tests for the HELD capability.
    optional_local_rag: Local RAG tests for the ADVISORY/FROZEN capability.
